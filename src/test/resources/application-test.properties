# Test Application Settings
spring.application.name=kafka2crm-test
server.port=0

# Kafka Consumer Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=kafka2crm-test-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
kafka.consumer.group-id=kafka2crm-test-group

# Kafka Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Topic Configuration
kafka.topic.clientes=CLIENTES

# CRM API Configuration for Tests - Point to WireMock server
crm.api.url=http://localhost:8080/api/v2/clientes
wiremock.port=8080

# Test Context Configuration
spring.main.allow-bean-definition-overriding=true

# Logging Configuration
logging.level.com.integration.kafka2crm=DEBUG
logging.level.org.springframework.kafka=WARN
logging.level.org.apache.kafka=WARN
logging.level.com.github.tomakehurst.wiremock=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n 