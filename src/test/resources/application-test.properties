# Kafka embutido para testes
spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers}
kafka.topic.clientes=CLIENTES
kafka.consumer.group-id=crm-integration-test

# Configurações do CRM para testes (usando WireMock)
crm.api.base-url=http://localhost:8089
crm.api.clients-endpoint=/api/v2/clientes

# Permitir sobrescrita de beans - necessário para testes
spring.main.allow-bean-definition-overriding=true

# Debug logging
logging.level.com.integration.kafka2crm=DEBUG
logging.level.org.springframework.kafka=DEBUG
logging.level.org.apache.kafka=DEBUG 