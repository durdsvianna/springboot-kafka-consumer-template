# Spring Application Settings
spring.application.name=kafka2crm
server.port=8081

# Kafka Consumer Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=kafka2crm-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Topic Configuration
kafka.topic.clientes=CLIENTES

# CRM API Configuration
crm.api.url=https://crm.com/api/v2/clientes

# Logging Configuration
logging.level.com.integration.kafka2crm=INFO
logging.level.org.springframework.kafka=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n 